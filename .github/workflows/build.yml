name: Build Ave.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        shell: bash
        run: sed -i 's/^VERSION = "dev"/VERSION = "v4.0.${{ github.run_number }}"/' ave/ave.py && grep -n '^VERSION' ave/ave.py
      - name: Build
        run: |
          pip install "pyinstaller>=6.10"
          pyinstaller --onefile --noconsole --name Ave ave/ave.py
      - name: Smoke test (cleanup mode runs and exits)
        run: .\dist\Ave.exe --cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: Ave
          path: dist/Ave.exe
      - name: Release notes from DEVLOG
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          awk '/^## /{n++} n==1' ave/DEVLOG.md | tail -n +2 > notes.md
          printf '\n---\nDownload `Ave.exe`, put it in your `ave` folder, right-click > Run as administrator.\nUnsigned app: if SmartScreen warns, More info > Run anyway. Defender: exclude your `ave` folder and `%%LOCALAPPDATA%%\\Ave`.\n' >> notes.md
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: Ave 4.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/Ave.exe
          body_path: notes.md
