name: Build Ave.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name Ave ave/ave.py
      - name: Smoke test (cleanup mode runs and exits)
        run: .\dist\Ave.exe --cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: Ave
          path: dist/Ave.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ave.exe
          body: |
            **Ave** - no-killswitch focus timer, watched over by Oblivionis.
            Download `Ave.exe`, put it anywhere (e.g. a folder called `ave`), right-click > Run as administrator.
            Windows SmartScreen may warn because the exe is unsigned: More info > Run anyway.
